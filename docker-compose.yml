# Dev Docker Compose
# Nginx on port 80: /api/* → Spring Boot, /* → React dev server
# Configure DB connection in .env file (see .env.example)

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ${FRONTEND_PATH:-../frontend}:/app
      - frontend_node_modules:/app/node_modules
    # No ports exposed — Nginx proxies to this container

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  app:
    build: .
    ports:
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLWRldi1vbmx5LWp3dC1zZWNyZXQta2V5LTMyYg==}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SERVER_PORT: 8080
    volumes:
      - ${WALLET_PATH:-./wallet}:/opt/oracle/wallet:ro
    depends_on:
      mailpit:
        condition: service_started

volumes:
  frontend_node_modules:
