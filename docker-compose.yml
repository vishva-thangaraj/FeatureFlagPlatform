
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  app:
    build: .
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # No default, by design. This used to carry a base64 key that is committed to the repository, so
      # anyone who could read the repo could forge an HS256 token with any sub/tenantId/roles they liked
      # against every deployment that had not overridden it. `:?` makes compose refuse to start instead.
      # Generate one with: openssl rand -base64 32   (see .env.example)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - generate one with "openssl rand -base64 32"}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SERVER_PORT: 8080

volumes:
  frontend_node_modules:
