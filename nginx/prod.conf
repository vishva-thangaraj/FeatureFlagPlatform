# NOT the deployed configuration. The production stack renders nginx/prod.conf.template
# instead, which adds the TLS server block, the HTTP->HTTPS redirect and the ACME challenge
# location, and takes the hostname from ${API_DOMAIN}. This file is kept as the plain-HTTP
# reference (and is what CLIENT_TEACHING_PLAN.md walks through). Changes made here do not
# reach production — mirror them into the template.
#
# NOTE ON X-Forwarded-For
# $proxy_add_x_forwarded_for APPENDS the peer nginx actually saw to whatever the client
# sent, so the header arriving at the app is "<client-supplied junk>, <real client IP>".
# Only the entries nginx appended are trustworthy. The backend therefore reads the
# client IP app.security.rate-limit.proxy-hop-count entries from the RIGHT (1 = this
# single nginx hop) and only for requests coming from a configured trusted proxy.
# If another appending proxy (CDN / load balancer) is put in front of nginx, bump
# RATE_LIMIT_PROXY_HOPS to match, or the app will throttle on that proxy's address.
server {
    listen 80;
    server_name _;

    # Forward /api/* requests to Spring Boot backend
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # React frontend — serve static build files
    location / {
        root /usr/share/nginx/html;

        # try_files is the key for SPA routing:
        # 1. Try exact file match ($uri)         — serves JS, CSS, images
        # 2. Try directory match ($uri/)          — serves index in subdirectory
        # 3. Fall back to /index.html             — React Router handles the route
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
