## =============================================================================
## GitLab CI/CD Pipeline
## Stages: test → secret-detection → build → deploy
##
## Required CI/CD Variables (set in GitLab > Settings > CI/CD > Variables):
##   OCI_REGION            - e.g., ap-mumbai-1
##   OCI_TENANCY_NAMESPACE - OCIR tenancy namespace
##   OCI_REPO_NAME         - OCIR repository name
##   OCI_USERNAME          - OCI username for OCIR login
##   OCI_AUTH_TOKEN        - OCI auth token (masked)
##   OCI_SSH_PRIVATE_KEY   - SSH private key for VM (file type, masked)
##   OCI_VM_HOST           - VM public IP address
##   OCI_VM_USER           - SSH user on the VM (e.g., ubuntu)
##   OCI_VM_HOST_KEY       - Output of: ssh-keyscan <VM_IP>
## =============================================================================
#
#stages:
#  - test
#  - secret-detection
#  - build
#  - deploy
#
#variables:
#  SECRET_DETECTION_ENABLED: 'true'
