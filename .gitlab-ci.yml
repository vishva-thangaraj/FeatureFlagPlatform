stages:
    - test

test:
    stage: test
    image: eclipse-temurin:17-jdk
    script:
        - ./gradlew test
    rules:
        - if: '$CI_PIPELINE_SOURCE == "push"'           # feature branch push
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # merge request
        - if: '$CI_COMMIT_BRANCH == "main"'