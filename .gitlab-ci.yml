#  DOCKER_IMAGE: ${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}/${OCI_REPO_NAME}/platform
#  # Tag each image with the short commit SHA for traceability & rollback
#  DOCKER_TAG: ${CI_COMMIT_SHORT_SHA}
#
