# Test profile — self-contained, no external DB or env vars required.
# Used by @SpringBootTest classes annotated with @ActiveProfiles("test").

# In-memory H2 in MySQL-compatibility mode; schema built from entities each run.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dev-only 256-bit secret so JwtTokenProvider can build its signing key.
jwt.secret=dGhpcy1pcy1hLWRldi1vbmx5LWp3dC1zZWNyZXQta2V5LTMyYg==

# Mail is not exercised in the context-load test.
spring.mail.host=localhost
spring.mail.port=1025
