# Test profile — self-contained, no external DB or env vars required.
# Used by @SpringBootTest classes annotated with @ActiveProfiles("test").

# In-memory H2 in MySQL-compatibility mode; schema built from entities each run.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test-only 256-bit secret so JwtTokenProvider can build a stable signing key across a test run.
# NOT the key this repository used to ship: that one is on JwtSecretPolicy's published-secrets list and is
# now refused in every profile, tests included.
jwt.secret=AYYa0mJ5bYM1EnPH4JVJR+VObXMtchmcEfOjqbhnANw=

# Mail is not exercised in the context-load test.
spring.mail.host=localhost
spring.mail.port=1025
