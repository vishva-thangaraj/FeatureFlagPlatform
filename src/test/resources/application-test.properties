# Test profile — self-contained, no external DB or env vars required.
# Used by @SpringBootTest classes annotated with @ActiveProfiles("test").

# In-memory H2 in MySQL-compatibility mode; schema built from entities each run.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test-only 256-bit secret so JwtTokenProvider can build a stable signing key across a test run.
# NOT the key this repository used to ship: that one is on JwtSecretPolicy's published-secrets list and is
# now refused in every profile, tests included.
jwt.secret=AYYa0mJ5bYM1EnPH4JVJR+VObXMtchmcEfOjqbhnANw=

# Mail is not exercised in the context-load test.
spring.mail.host=localhost
spring.mail.port=1025

# Kafka — no broker in the test suite. The producer is never asked to send (nothing here
# commits a feature write against a real template), but topic provisioning would try to
# reach a broker on every context load, so it is off. Timeouts are shortened as a second
# line of defence: if anything does reach out, it fails in milliseconds, not minutes.
app.kafka.topic.auto-provision=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.max.block.ms=200
spring.kafka.producer.properties.request.timeout.ms=200
spring.kafka.producer.properties.delivery.timeout.ms=400
spring.kafka.producer.properties.http.connect.timeout.ms=200
spring.kafka.producer.properties.http.read.timeout.ms=200
