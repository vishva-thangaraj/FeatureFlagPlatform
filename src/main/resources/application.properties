spring.application.name=platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties]

# Datasource common configuration
# Driver + dialect are auto-detected from the JDBC URL (jdbc:mysql://... -> MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
# Schema is managed by Hibernate (no Flyway). "update" creates/extends tables from entities.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Server
server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
jwt.invitation-expiration-ms=${JWT_INVITATION_EXPIRATION:604800000}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# App
app.base-url=${APP_BASE_URL:http://localhost}
app.client-base-url=${APP_CLIENT_BASE_URL:http://localhost}
app.mail.from=${APP_MAIL_FROM:noreply@featureflag.dev}

# ---------------------------------------------------------------------------
# Kafka — feature-change event producer
#
# These live here, NOT per profile: `spring.kafka.producer.key-serializer` and
# `value-serializer` have no framework default, so a profile that omits them fails
# every send with `ConfigException: Missing required configuration "key.serializer"`,
# and `bootstrap-servers` silently falls back to localhost:9092. Profiles do not
# inherit from one another, so anything a profile does not repeat is simply absent.
# Profile files override ONLY the endpoints. prod/staging drop the localhost fallback and
# leave them empty, which disables publishing loudly rather than failing startup.
app.kafka.topic.feature-changes=feature.flag.changes.v1
# Contract: docs/feature-events.md — 6 partitions, RF 1 locally / 3 in prod.
app.kafka.topic.feature-changes-partitions=${KAFKA_TOPIC_PARTITIONS:6}
app.kafka.topic.feature-changes-replicas=${KAFKA_TOPIC_REPLICAS:1}
# Create the topic on startup rather than letting the broker auto-create it with 1
# partition. Set false where topics are provisioned by infrastructure code.
app.kafka.topic.auto-provision=${KAFKA_TOPIC_AUTO_PROVISION:true}
# Explicit off switch, independent of whether a broker happens to be reachable.
app.kafka.enabled=${KAFKA_ENABLED:true}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.schema.registry.url=${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
# Durability: every in-sync replica must have the record before it counts as written, and
# the producer de-duplicates its own retries so a retry cannot double-write a partition.
# Previously set only in dev/docker, i.e. prod ran on the weaker defaults.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Timeouts. Publishing happens on a background pool, but an unbounded block there still
# ties up a thread for the whole of a broker outage, and the Kafka/Confluent defaults are
# catastrophic: max.block.ms defaults to 60s and the schema-registry HTTP client to 60s
# connect + 60s read. An event is an optional notification; it must fail fast and loudly.
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:15000}
spring.kafka.producer.properties.linger.ms=${KAFKA_LINGER_MS:5}
spring.kafka.producer.properties.max.request.size=${KAFKA_MAX_REQUEST_SIZE:1048576}
# Confluent schema-registry client (read by KafkaAvroSerializer from the producer configs).
spring.kafka.producer.properties.http.connect.timeout.ms=${KAFKA_SCHEMA_REGISTRY_CONNECT_TIMEOUT_MS:3000}
spring.kafka.producer.properties.http.read.timeout.ms=${KAFKA_SCHEMA_REGISTRY_READ_TIMEOUT_MS:5000}
# Admin client used for topic provisioning — same fail-fast posture.
spring.kafka.admin.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:5000}
spring.kafka.admin.properties.default.api.timeout.ms=${KAFKA_ADMIN_API_TIMEOUT_MS:10000}
spring.kafka.admin.fail-fast=false

# Publisher pool (see FeatureMessagingConfig) — bounded so a broker outage cannot grow
# an unbounded backlog in memory.
app.kafka.publisher.core-pool-size=${KAFKA_PUBLISHER_CORE_POOL_SIZE:2}
app.kafka.publisher.max-pool-size=${KAFKA_PUBLISHER_MAX_POOL_SIZE:4}
app.kafka.publisher.queue-capacity=${KAFKA_PUBLISHER_QUEUE_CAPACITY:500}


# ---------------------------------------------------------------------------
# API security policy
# Loaded fail-closed: if this classpath resource is missing or malformed the
# application refuses to start rather than running with role checks disabled.
app.security.api-policy-resource=${API_SECURITY_POLICY:api-security.json}

# Rate limiting — how the caller behind a request is identified.
# X-Forwarded-For is client-supplied, so it is ONLY read when the request came
# from one of these peers (comma-separated IPs or CIDRs). Default: EMPTY, i.e.
# "nothing in front of this app" — the header is ignored and only the real peer
# address is used. Set this to the reverse proxy's address when deploying behind one.
app.security.rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}
# Number of trusted proxies that APPEND to X-Forwarded-For (nginx's
# $proxy_add_x_forwarded_for counts as 1). The client IP is read that many hops
# from the RIGHT of the header; everything to the left of it is attacker-supplied.
app.security.rate-limit.proxy-hop-count=${RATE_LIMIT_PROXY_HOPS:1}
# Hard cap on live token buckets, bounding the memory one client can make us allocate.
app.security.rate-limit.max-buckets=${RATE_LIMIT_MAX_BUCKETS:100000}

# ---------------------------------------------------------------------------
# OpenAPI description. OFF here, so every profile that does not deliberately turn it on inherits off --
# prod and staging included. The dev and docker profiles enable it, and OpenApiConfig (which carries the
# permit rule these paths need) is confined to those same two profiles.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
