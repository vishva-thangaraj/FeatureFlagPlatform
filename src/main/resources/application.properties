spring.application.name=platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL common configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true

# Server
server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
jwt.invitation-expiration-ms=${JWT_INVITATION_EXPIRATION:604800000}

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.client-base-url=${APP_CLIENT_BASE_URL:http://localhost:5173}
app.mail.from=${APP_MAIL_FROM:noreply@featureflag.dev}
