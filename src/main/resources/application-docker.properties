# Docker environment — connects to external Oracle DB via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}

# Kafka — the app runs as a container, so it reaches the broker and registry by their
# Docker service names on the INTERNAL listener (not localhost, which is the app container itself).
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.properties.schema.registry.url=http://schema-registry:8081
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
app.kafka.topic.feature-changes=feature.flag.changes.v1