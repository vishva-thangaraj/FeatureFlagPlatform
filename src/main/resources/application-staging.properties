# Staging environment — all values from environment variables, no defaults
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}

# Kafka — endpoints are mandatory (no localhost fallback), same as prod. Serializers,
# acks=all, idempotence and the timeouts are inherited from application.properties.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.schema.registry.url=${KAFKA_SCHEMA_REGISTRY_URL}
app.kafka.topic.feature-changes-replicas=${KAFKA_TOPIC_REPLICAS:3}
