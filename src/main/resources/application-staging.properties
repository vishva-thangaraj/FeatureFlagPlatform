# Staging environment — all values from environment variables, no defaults
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}

# Kafka — endpoints are optional so that a deployment without a broker still starts. They have no
# localhost fallback (that would silently point production at itself); left unset, feature-change
# event publishing is DISABLED and says so loudly at startup, and every dropped event is logged and
# counted. That is deliberate: this channel currently has no consumer, so making it a hard boot
# dependency would let a missing broker take down the whole API — including the read paths SDKs
# depend on — to protect events nothing reads yet. Set both to enable publishing.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
spring.kafka.properties.schema.registry.url=${KAFKA_SCHEMA_REGISTRY_URL:}
app.kafka.topic.feature-changes-replicas=${KAFKA_TOPIC_REPLICAS:3}
