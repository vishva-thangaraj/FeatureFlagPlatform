# Dev environment — local bootRun uses Mac wallet path
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# JWT — NO committed default.
#
# There used to be a literal base64 key here, and `dev` is also the profile application.properties falls
# back to when SPRING_PROFILES_ACTIVE is unset — so a deployment that merely forgot to set the profile
# signed its tokens with a key published in this repository. Anyone could then mint a token with any sub,
# tenantId and roles:["OWNER"].
#
# Empty means "unset": JwtSecretPolicy generates a random 256-bit key at every boot for the dev/test/local
# profiles (tokens simply do not survive a restart), and refuses to start without one anywhere else. Export
# JWT_SECRET to pin a stable dev key: openssl rand -base64 32
jwt.secret=${JWT_SECRET:}

# Mail — Mailpit (run via docker-compose or standalone: docker run -p 8025:8025 -p 1025:1025 axllent/mailpit)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Kafka — endpoints only; serializers, durability and timeouts come from application.properties.
# bootRun on the host reaches the docker-compose broker on its PLAINTEXT_HOST listener.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.schema.registry.url=${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
