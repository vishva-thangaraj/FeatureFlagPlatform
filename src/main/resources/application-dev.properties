# Dev environment — local bootRun uses Mac wallet path
spring.datasource.url=${DEV_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# JWT — dev-only default secret (base64-encoded, 256-bit)
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LWp3dC1zZWNyZXQta2V5LTMyYg==}

# Mail — Mailpit (run via docker-compose or standalone: docker run -p 8025:8025 -p 1025:1025 axllent/mailpit)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false