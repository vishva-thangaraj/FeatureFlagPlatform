# Production Docker Compose — runs on OCI ARM VM
# Nginx serves React build files + proxies /api/* to backend
# Place at /opt/platform/ on the VM

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-build:/usr/share/nginx/html:ro
    depends_on:
      - app

  app:
    image: ${OCI_REGION}.ocir.io/${OCI_TENANCY_NAMESPACE}/${OCI_REPO_NAME}/platform:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_CLIENT_BASE_URL: ${APP_CLIENT_BASE_URL}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
    volumes:
      - ${WALLET_PATH:-./wallet}:/opt/oracle/wallet:ro
